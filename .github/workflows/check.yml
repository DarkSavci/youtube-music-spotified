name: Check

on:
  pull_request:
  push:
    branches: [master, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json
            listen-together/package-lock.json
      - run: npm ci --prefix ui
      - run: npm ci --prefix desktop
      - run: npm ci --prefix listen-together
      - run: npm test --prefix listen-together
      - run: go test ./...
      - run: npm test --prefix desktop
      - run: npx --no-install electron test/audio-smoke.js
        working-directory: desktop
      - run: npm run package --prefix desktop
      - run: npx --no-install electron test/playlist-smoke.js
        working-directory: desktop
      - run: npx --no-install electron test/route-smoke.js
        working-directory: desktop
      - run: npx --no-install electron test/video-smoke.js
        working-directory: desktop
      - run: node desktop/test/package-smoke.js
