# Builds the Windows installer and publishes it as a GitHub release, which the
# app's updater (desktop/updater.js) picks up.
#
# A release happens when desktop/package.json carries a version that has no
# release yet:
#   - push a commit to master that bumps the version, or
#   - run this workflow by hand (Actions → Release → Run workflow), which bumps
#     the version for you, commits it and releases it.
# Pushes that leave the version alone build nothing.

name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# One release at a time; a second push waits instead of racing for the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$version"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Check for an existing release
        id: version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.version.outputs.release == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: go test ./...

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: |
          npm ci --prefix ui
          npm ci --prefix desktop

      - name: Build installer
        if: steps.version.outputs.release == 'true'
        working-directory: desktop
        run: npm run installer

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          setup="dist-installer/Youtube-Music-Spotified-Setup-$version.exe"
          # latest.yml and the blockmap are what the updater reads; the
          # installer is what both it and new users download.
          gh release create "v$version" \
            "$setup" "$setup.blockmap" dist-installer/latest.yml \
            --target "$(git rev-parse HEAD)" \
            --title "v$version" \
            --generate-notes
