# Build one prepared commit on all platforms before publishing anything.
name: Release
run-name: Release ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: New version number (e.g. 0.1.9)
        type: string
        required: true
# Read-only by default: the build jobs install and run third-party packages.
# Only publish, which pushes the release commit and creates the release,
# gets write access.
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Release from master only
        if: github.ref_name != 'master'
        run: |
          echo "::error::Releases are made from master only."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the version
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          current=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$VERSION\" is not a version number like 0.1.5."
            exit 1
          fi
          # One line: a multi-line -e script is lost on the Windows runner.
          newer=$(node -e 'const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); const i = [0, 1, 2].find((k) => a[k] !== b[k]); console.log(i !== undefined && a[i] > b[i]);' "$VERSION" "$current")
          if [ "$newer" != "true" ]; then
            echo "::error::$VERSION is not higher than the current version, $current."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released."
            exit 1
          fi
          echo "Releasing v$VERSION (current: $current)."

      - name: Set the version and write the changelog
        run: |
          (cd desktop && npm version "$VERSION" --no-git-tag-version)
          # The app bundles CHANGELOG.md, so it is written before the build.
          npx --yes git-cliff@2.14.2 --tag "v$VERSION" -o CHANGELOG.md
          # This release's notes alone, for the GitHub release. Kept out of
          # the repository.
          npx --yes git-cliff@2.14.2 --unreleased --tag "v$VERSION" --strip header -o "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md desktop/package.json desktop/package-lock.json
          git commit -m "chore: release v$VERSION"

      - name: Save the prepared commit
        id: version
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir prepared
          git bundle create prepared/source.bundle HEAD
          cp "$RUNNER_TEMP/notes.md" prepared/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-source
          path: prepared/
          retention-days: 3

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: win32
          - os: macos-15
            arch: arm64
            platform: darwin
          - os: macos-15-intel
            arch: x64
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes; keep the token away from install scripts.
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
          path: prepared
      - name: Check out the exact prepared version
        run: |
          git fetch prepared/source.bundle HEAD
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - name: Install and test
        run: |
          npm ci --prefix ui
          npm ci --prefix desktop
          npm ci --prefix listen-together
          go test ./...
          npm test --prefix desktop
          npm test --prefix listen-together
      - name: Build Windows installer
        if: matrix.platform == 'win32'
        run: npm run installer --prefix desktop
      - name: Build macOS application
        if: matrix.platform == 'darwin'
        run: |
          npm run package --prefix desktop
          mkdir -p dist-installer
          ditto -c -k --sequesterRsrc --keepParent "dist-desktop/Youtube Music Spotified-darwin-$BUILD_ARCH/Youtube Music Spotified.app" "dist-installer/Youtube-Music-Spotified-$VERSION-macOS-$BUILD_ARCH.zip"
      - name: Verify bundled helpers
        run: node desktop/test/package-smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-installer/*.exe
            dist-installer/*.blockmap
            dist-installer/latest.yml
            dist-installer/*.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
          path: prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish all platforms together
        run: |
          git fetch prepared/source.bundle HEAD
          git checkout --detach FETCH_HEAD
          # Reject a stale release if master advanced during the builds.
          git push origin HEAD:master
          cd release-assets
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cd ..
          cat >> prepared/notes.md <<'NOTES'

          macOS: download the arm64 archive for Apple Silicon, or x64 for Intel.
          These builds are ad-hoc signed, not Developer ID signed or notarized.
          On first launch macOS blocks the app: open System Settings → Privacy & Security and choose Open Anyway
          (or run `xattr -dr com.apple.quarantine "/Applications/Youtube Music Spotified.app"`).
          macOS updates require downloading the new archive; automatic updates remain Windows-only.
          NOTES
          gh release create "v$VERSION" release-assets/* --target "$(git rev-parse HEAD)" --title "v$VERSION" --notes-file prepared/notes.md
