# Builds the Windows installer and publishes it as a GitHub release, which the
# app's updater (desktop/updater.js) picks up.
#
# Releases are made by hand, never by a push: Actions → Release → Run workflow,
# on master, with the new version number. The release contains every commit on
# master at that moment.
#
# The version is checked (x.y.z, higher than the current one, not released
# yet), then the tests run and the installer is built. Only once all of that
# has worked is the version commit pushed and the release published from it,
# so a failed run leaves master and the releases untouched.
#
# The release notes, and CHANGELOG.md (which the app shows under What's new),
# are written by git-cliff from the commit messages since the last release;
# cliff.toml says how.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version number (e.g. 0.1.5)
        type: string
        required: true

permissions:
  contents: write

# One release at a time; a second run waits instead of racing for the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Release from master only
        if: github.ref_name != 'master'
        run: |
          echo "::error::Run the release from master, not ${{ github.ref_name }}."
          exit 1

      - uses: actions/checkout@v4
        with:
          # The whole history and its tags: the changelog is everything since
          # the last release tag, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the version
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          current=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$VERSION\" is not a version number like 0.1.5."
            exit 1
          fi
          # One line: a multi-line -e script is lost on the Windows runner.
          newer=$(node -e 'const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); const i = [0, 1, 2].find((k) => a[k] !== b[k]); console.log(i !== undefined && a[i] > b[i]);' "$VERSION" "$current")
          if [ "$newer" != "true" ]; then
            echo "::error::$VERSION is not higher than the current version, $current."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released."
            exit 1
          fi
          echo "Releasing v$VERSION (current: $current)."

      - name: Set the version and write the changelog
        run: |
          (cd desktop && npm version "$VERSION" --no-git-tag-version)
          # The app bundles CHANGELOG.md, so it is written before the build.
          npx --yes git-cliff@2.14.2 --tag "v$VERSION" -o CHANGELOG.md
          # This release's notes alone, for the GitHub release. Kept out of
          # the repository.
          npx --yes git-cliff@2.14.2 --unreleased --tag "v$VERSION" --strip header -o "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md desktop/package.json desktop/package-lock.json
          git commit -m "chore: release v$VERSION"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Install dependencies
        run: |
          npm ci --prefix ui
          npm ci --prefix desktop

      - name: Build installer
        working-directory: desktop
        run: npm run installer

      - name: Publish release
        run: |
          # The version commit goes to master only now that the build worked.
          git push origin HEAD:master
          setup="dist-installer/Youtube-Music-Spotified-Setup-$VERSION.exe"
          # latest.yml and the blockmap are what the updater reads; the
          # installer is what both it and new users download.
          gh release create "v$VERSION" \
            "$setup" "$setup.blockmap" dist-installer/latest.yml \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
